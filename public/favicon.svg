<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Aura">
  <!--
    Favicon adaptável (light / dark)  mesma geometria do AuraMark.
    Light: traços #151716 (visível em abas claras).
    Dark: traços #DCCFFF (brand Aura).
  -->
  <style>
    .core { fill: #151716; }
    .ring { stroke: #151716; }
    @media (prefers-color-scheme: dark) {
      .core { fill: #DCCFFF; }
      .ring { stroke: #DCCFFF; }
    }
  </style>
  <circle class="core" cx="16" cy="16" r="3.5" />
  <circle class="ring" cx="16" cy="16" r="7" stroke-width="1.25" opacity="0.85" />
  <circle class="ring" cx="16" cy="16" r="11" stroke-width="1" opacity="0.45" />
  <ellipse
    class="ring"
    cx="16"
    cy="16"
    rx="14.5"
    ry="12"
    stroke-width="0.75"
    opacity="0.28"
    transform="rotate(-18 16 16)"
  />
</svg>
