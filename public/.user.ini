; Aura — PHP overrides for HostGator docroot (Etapa E §1.5)
; Applies to aura.vonluqi.com when MultiPHP uses CGI/FPM with .user.ini support.
; Also set MultiPHP Manager → PHP 8.2 for this subdomain.

upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
memory_limit = 256M
display_errors = Off
log_errors = On
