name: Diagnose HostGator 500

# One-shot PHP via FTP/HTTPS: imprime a exception real (APP_DEBUG fica false).

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp curl python3

      - name: Run diagnose one-shot
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          export TOKEN
          DIR="${FTP_SERVER_DIR%/}"

          python3 <<'PY'
          import os
          from pathlib import Path
          token = os.environ["TOKEN"]
          php = r'''<?php
          declare(strict_types=1);
          error_reporting(E_ALL);
          ini_set('display_errors', '1');
          header('Content-Type: text/plain; charset=UTF-8');
          $expected = '__TOKEN__';
          $given = (string) ($_GET['token'] ?? '');
          if (!hash_equals($expected, $given)) { http_response_code(403); echo "Forbidden\n"; exit; }
          $root = dirname(__DIR__);
          echo "root=$root\nphp=".PHP_VERSION."\n";
          echo "autoload=". (is_file($root.'/vendor/autoload.php')?'yes':'no') ."\n";
          echo "env=". (is_file($root.'/.env')?'yes':'no') ."\n";
          echo "storage_writable=". (is_writable($root.'/storage')?'yes':'no') ."\n";
          echo "bootstrap_cache_writable=". (is_writable($root.'/bootstrap/cache')?'yes':'no') ."\n";
          @chmod($root.'/storage', 0775);
          @chmod($root.'/storage/logs', 0775);
          @chmod($root.'/storage/framework', 0775);
          @chmod($root.'/storage/framework/cache', 0775);
          @chmod($root.'/storage/framework/sessions', 0775);
          @chmod($root.'/storage/framework/views', 0775);
          @chmod($root.'/bootstrap/cache', 0775);
          try {
            require $root.'/vendor/autoload.php';
            $app = require $root.'/bootstrap/app.php';
            $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
            $kernel->bootstrap();
            echo "bootstrap=OK\n";
            echo "app_env=".config('app.env')." app_debug=".(config('app.debug')?'true':'false')."\n";
            echo "app_key_set=".(filled(config('app.key'))?'yes':'no')."\n";
            echo "db=".config('database.default')."/".config('database.connections.'.config('database.default').'.database')."\n";
            Illuminate\Support\Facades\DB::select('select 1');
            echo "db_ping=OK\n";
            $tables = Illuminate\Support\Facades\Schema::getTableListing();
            echo "tables=".count($tables)."\n";
            $http = $app->make(Illuminate\Contracts\Http\Kernel::class);
            $request = Illuminate\Http\Request::create('/', 'GET');
            $response = $http->handle($request);
            echo "home_status=".$response->getStatusCode()."\n";
            $content = (string) $response->getContent();
            echo "home_len=".strlen($content)."\n";
            if ($response->getStatusCode() >= 400) {
              echo "home_body_snip=".substr(preg_replace('/\s+/', ' ', strip_tags($content)), 0, 500)."\n";
              // also last laravel log lines if any
              $log = $root.'/storage/logs/laravel.log';
              if (is_file($log)) {
                $tail = @file_get_contents($log);
                if (is_string($tail) && $tail !== '') {
                  echo "log_tail=".substr($tail, -1500)."\n";
                }
              }
            } else {
              echo "HOME_OK\n";
            }
            @unlink($root.'/bootstrap/cache/routes-v7.php');
            @unlink($root.'/bootstrap/cache/routes.php');
            @unlink($root.'/bootstrap/cache/config.php');
            Illuminate\Support\Facades\Artisan::call('route:clear');
            Illuminate\Support\Facades\Artisan::call('config:clear');
            Illuminate\Support\Facades\Artisan::call('view:clear');
            echo "caches_cleared\n";
            $response2 = $http->handle(Illuminate\Http\Request::create('/', 'GET'));
            echo "home_status_after_clear=".$response2->getStatusCode()."\n";
            if ($response2->getStatusCode() < 400) echo "HOME_OK_AFTER_CLEAR\n";
            echo "DIAG_OK\n";
          } catch (Throwable $e) {
            echo "ERROR: ".$e->getMessage()."\n";
            echo $e->getFile().":".$e->getLine()."\n";
            echo substr($e->getTraceAsString(), 0, 2000)."\n";
          }
          @unlink(__FILE__);
          '''
          php = php.replace('__TOKEN__', token)
          lines = []
          for line in php.splitlines(True):
              lines.append(line[2:] if line.startswith('  ') else line)
          Path('__diag_once.php').write_text(''.join(lines), encoding='utf-8', newline='\n')
          PY

          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR}/public;
            put __diag_once.php;
            bye
          "

          RESP=$(mktemp)
          CODE=$(curl -sS -L --max-time 120 -o "$RESP" -w "%{http_code}" \
            "https://aura.vonluqi.com/__diag_once.php?token=${TOKEN}" || echo 000)
          echo "HTTP_CODE=$CODE"
          echo "----- BODY -----"
          cat "$RESP"
          echo ""
          echo "----- END -----"

          lftp -c "
            set ftp:ssl-allow no;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR}/public;
            rm -f __diag_once.php;
            bye
          " || true
          rm -f __diag_once.php
          grep -qE 'DIAG_OK|HOME_OK|ERROR:' "$RESP"
         