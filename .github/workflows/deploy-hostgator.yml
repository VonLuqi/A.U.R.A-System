name: Deploy HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, curl, zip, pdo_mysql, fileinfo, openssl, tokenizer, gd
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Pack vendor (single archive — FTP file-by-file is too slow)
        run: tar -czf vendor.tar.gz vendor

      - name: Deploy app via FTP (without vendor/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/.env.db.*
            **/.env.ftp.*
            **/node_modules/**
            **/vendor/**
            **/vendor.tar.gz
            **/tests/**
            **/.vscode/**
            **/docs/**
            **/phpunit.xml
            **/.editorconfig
            **/README.md
            **/.phpunit.result.cache
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/private/statements/**
            **/.DS_Store
            **/Thumbs.db

      - name: Upload vendor.tar.gz via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          DIR="${FTP_SERVER_DIR%/}"
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 3;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR};
            put vendor.tar.gz;
            bye
          "

      - name: Extract vendor + migrate (SSH)
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          SCRIPT=$(cat <<'EOF'
          set -e
          cd ~/aura || cd /home4/luca9682/aura
          if [ -f vendor.tar.gz ]; then
            tar -xzf vendor.tar.gz
            rm -f vendor.tar.gz
            echo "Vendor extracted OK"
          fi
          PHP_BIN=php
          command -v ea-php82 >/dev/null 2>&1 && PHP_BIN=ea-php82
          [ -x /opt/cpanel/ea-php82/root/usr/bin/php ] && PHP_BIN=/opt/cpanel/ea-php82/root/usr/bin/php
          $PHP_BIN artisan --version
          $PHP_BIN artisan migrate --force
          $PHP_BIN artisan config:cache
          $PHP_BIN artisan route:cache || true
          $PHP_BIN artisan view:cache || true
          echo "Migrate + cache OK"
          EOF
          )
          OUT=$(mktemp)
          OK=0
          for PORT in 22 2222; do
            set +e
            sshpass -e ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              -p "$PORT" "${SSH_USER}@${SSH_HOST}" "bash -s" <<<"$SCRIPT" 2>&1 | tee "$OUT"
            RC=${PIPESTATUS[0]}
            set -e
            if grep -qi "Shell access is not enabled" "$OUT"; then
              echo "FATAL: enable SSH Access in cPanel, then re-run deploy/migrate."
              exit 1
            fi
            if [ "$RC" -eq 0 ] && grep -q "Migrate + cache OK" "$OUT"; then
              OK=1
              break
            fi
          done
          test "$OK" -eq 1
