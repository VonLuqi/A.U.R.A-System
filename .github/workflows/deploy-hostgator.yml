name: Deploy HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, curl, zip, pdo_mysql, fileinfo, openssl, tokenizer, gd
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Pack vendor (single archive — FTP file-by-file is too slow)
        run: tar -czf vendor.tar.gz vendor

      - name: Deploy app via FTP (without vendor/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.*
            **/.env.db.*
            **/.env.ftp.*
            **/node_modules/**
            **/vendor/**
            **/vendor.tar.gz
            **/tests/**
            **/.vscode/**
            **/docs/**
            **/phpunit.xml
            **/.editorconfig
            **/README.md
            **/.phpunit.result.cache
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/private/statements/**
            **/.DS_Store
            **/Thumbs.db

      - name: Upload vendor.tar.gz via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          DIR="${FTP_SERVER_DIR%/}"
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 3;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR};
            put vendor.tar.gz;
            bye
          "

      - name: Extract vendor on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd ~/aura || cd /home4/luca9682/aura
            tar -xzf vendor.tar.gz
            rm -f vendor.tar.gz
            php artisan --version || true
            echo "Vendor extracted OK"
