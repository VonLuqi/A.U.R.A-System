name: Migrate HostGator

# Migrate sem shell SSH: FTP + PHP one-shot por HTTPS.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp curl python3

      - name: Upload one-shot migrate + run + delete
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          export TOKEN
          DIR="${FTP_SERVER_DIR%/}"

          python3 <<'PY'
          import os
          from pathlib import Path

          token = os.environ["TOKEN"]
          # Keep PHP braces literal; only inject token.
          php = """<?php
          declare(strict_types=1);
          error_reporting(E_ALL);
          ini_set('display_errors', '1');
          header('Content-Type: text/plain; charset=UTF-8');

          $expected = '__TOKEN__';
          $given = (string) ($_GET['token'] ?? '');
          if ($expected === '' || !hash_equals($expected, $given)) {
              http_response_code(403);
              echo "Forbidden\\n";
              exit;
          }

          function fail(string $msg): void {
              http_response_code(500);
              echo "ERROR: {$msg}\\n";
              @unlink(__FILE__);
              exit(1);
          }

          $root = dirname(__DIR__);
          echo "root={$root}\\n";
          echo "php=" . PHP_VERSION . "\\n";

          if (!is_file($root . '/vendor/autoload.php')) {
              $gz = $root . '/vendor.tar.gz';
              if (!is_file($gz)) {
                  fail('vendor/autoload.php missing AND vendor.tar.gz missing — run Deploy HostGator first');
              }
              echo "extracting vendor.tar.gz ...\\n";
              try {
                  if (!class_exists('PharData')) {
                      fail('PharData unavailable on this host');
                  }
                  @unlink($root . '/vendor.tar');
                  $phar = new PharData($gz);
                  $phar->decompress();
                  $tarFile = $root . '/vendor.tar';
                  if (!is_file($tarFile)) {
                      fail('decompress did not create vendor.tar');
                  }
                  $tar = new PharData($tarFile);
                  $tar->extractTo($root, null, true);
                  @unlink($tarFile);
                  echo "vendor extracted OK\\n";
              } catch (Throwable $e) {
                  fail('vendor extract failed: ' . $e->getMessage());
              }
              if (!is_file($root . '/vendor/autoload.php')) {
                  fail('extract ran but vendor/autoload.php still missing');
              }
          }
          if (!is_file($root . '/.env')) {
              fail('.env missing in Laravel root');
          }

          try {
              require $root . '/vendor/autoload.php';
              $app = require $root . '/bootstrap/app.php';
              $kernel = $app->make(Illuminate\\Contracts\\Console\\Kernel::class);
              $kernel->bootstrap();

              $driver = (string) config('database.default');
              $db = (string) config("database.connections.{$driver}.database");
              $host = (string) config("database.connections.{$driver}.host");
              echo "driver={$driver}\\n";
              echo "host={$host}\\n";
              echo "database={$db}\\n";

              if ($driver !== 'mysql' || $db !== 'luca9682_aura') {
                  fail("Expected mysql/luca9682_aura, got {$driver}/{$db}");
              }

              $envPath = $root . '/.env';
              $env = file_get_contents($envPath);
              if ($env !== false && preg_match('/^DB_PASSWORD=[^"].*[@#$!]/m', $env)) {
                  $env2 = preg_replace('/^DB_PASSWORD=(.*)$/m', 'DB_PASSWORD="$1"', $env, 1);
                  file_put_contents($envPath, $env2);
                  echo "quoted DB_PASSWORD\\n";
              }

              Illuminate\\Support\\Facades\\Artisan::call('config:clear');
              Illuminate\\Support\\Facades\\Artisan::call('migrate', ['--force' => true]);
              echo Illuminate\\Support\\Facades\\Artisan::output();

              $tables = Illuminate\\Support\\Facades\\Schema::getTableListing();
              sort($tables);
              echo 'tables=' . implode(',', $tables) . "\\n";
              echo 'count=' . count($tables) . "\\n";

              foreach (['migrations', 'users', 'sessions', 'cache'] as $need) {
                  if (!in_array($need, $tables, true)) {
                      fail("Missing table: {$need}");
                  }
              }

              @mkdir($root . '/storage/app/public/avatars', 0775, true);
              try {
                  Illuminate\\Support\\Facades\\Artisan::call('storage:link');
                  echo Illuminate\\Support\\Facades\\Artisan::output();
                  echo "storage:link OK\\n";
              } catch (Throwable $e) {
                  echo "storage:link skipped: " . $e->getMessage() . "\\n";
              }

              Illuminate\\Support\\Facades\\Artisan::call('config:cache');
              echo "config:cache OK\\n";
              echo "MIGRATE_OK\\n";
          } catch (Throwable $e) {
              fail($e->getMessage() . ' @ ' . $e->getFile() . ':' . $e->getLine());
          }

          @unlink(__FILE__);
          """
          php = php.replace("__TOKEN__", token)
          # Dedent: template uses 2-space indent from YAML-less python string — strip leading 2 spaces per line if present after <?php block
          # Actually the """ content has leading 2 spaces on each line from my indentation in the workflow - strip them
          lines = php.splitlines(True)
          out = []
          for i, line in enumerate(lines):
              if line.startswith("  "):
                  out.append(line[2:])
              else:
                  out.append(line)
          text = "".join(out)
          Path("__migrate_once.php").write_text(text, encoding="utf-8", newline="\n")
          print("wrote", Path("__migrate_once.php").stat().st_size, "bytes")
          PY

          echo "=== first lines of one-shot ==="
          head -n 12 __migrate_once.php

          echo "Uploading one-shot via FTP..."
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR}/public;
            put __migrate_once.php;
            ls -l __migrate_once.php;
            bye
          "

          echo "Running migrate over HTTPS..."
          RESP_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -L --max-time 300 \
            -o "$RESP_FILE" -w "%{http_code}" \
            "https://aura.vonluqi.com/__migrate_once.php?token=${TOKEN}" || echo "000")
          echo "HTTP_CODE=$HTTP_CODE"
          echo "----- BODY -----"
          cat "$RESP_FILE" || true
          echo ""
          echo "----- END -----"

          echo "Deleting one-shot (best effort)..."
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR}/public;
            rm -f __migrate_once.php;
            bye
          " || true
          rm -f __migrate_once.php

          grep -q MIGRATE_OK "$RESP_FILE"
          echo "Migrate HostGator OK"
