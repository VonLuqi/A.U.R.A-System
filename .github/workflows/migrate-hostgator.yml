name: Migrate HostGator

# Roda só migrate/cache no servidor (sem FTP completo).
# Use quando o .env já está no servidor e o código já foi deployado.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Artisan migrate + cache (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd ~/aura || cd /home4/luca9682/aura
            test -f .env
            php artisan --version
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "Migrate + cache OK"
