name: Migrate HostGator

# Migrate sem shell SSH (HostGator costuma ter "Shell access is not enabled").
# Sobe um PHP one-shot via FTP, executa por HTTPS, apaga o arquivo.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp curl

      - name: Upload one-shot migrate + run + delete
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          DIR="${FTP_SERVER_DIR%/}"

          cat > __migrate_once.php <<PHP
          <?php
          declare(strict_types=1);

          \$expected = '${TOKEN}';
          \$given = (string) (\$_GET['token'] ?? '');
          if (\$expected === '' || !hash_equals(\$expected, \$given)) {
              http_response_code(403);
              header('Content-Type: text/plain; charset=UTF-8');
              echo "Forbidden\n";
              exit;
          }

          header('Content-Type: text/plain; charset=UTF-8');

          try {
              require __DIR__ . '/../vendor/autoload.php';
              \$app = require __DIR__ . '/../bootstrap/app.php';
              \$kernel = \$app->make(Illuminate\Contracts\Console\Kernel::class);
              \$kernel->bootstrap();

              \$driver = config('database.default');
              \$db = config("database.connections.{\$driver}.database");
              \$host = config("database.connections.{\$driver}.host");
              echo "driver={\$driver}\n";
              echo "host={\$host}\n";
              echo "database={\$db}\n";

              if (\$driver !== 'mysql' || \$db !== 'luca9682_aura') {
                  throw new RuntimeException("Expected mysql/luca9682_aura, got {\$driver}/{\$db}");
              }

              Illuminate\Support\Facades\Artisan::call('migrate', ['--force' => true]);
              echo Illuminate\Support\Facades\Artisan::output();

              \$tables = Illuminate\Support\Facades\Schema::getTableListing();
              sort(\$tables);
              echo 'tables=' . implode(',', \$tables) . "\n";
              echo 'count=' . count(\$tables) . "\n";

              foreach (['migrations', 'users', 'sessions', 'cache'] as \$need) {
                  if (!in_array(\$need, \$tables, true)) {
                      throw new RuntimeException("Missing table: {\$need}");
                  }
              }

              Illuminate\Support\Facades\Artisan::call('config:cache');
              echo "config:cache OK\n";
              echo "MIGRATE_OK\n";
          } catch (Throwable \$e) {
              http_response_code(500);
              echo 'ERROR: ' . \$e->getMessage() . "\n";
              echo \$e->getFile() . ':' . \$e->getLine() . "\n";
              @unlink(__FILE__);
              exit(1);
          }

          @unlink(__FILE__);
          PHP

          # Normalize leading spaces from heredoc indent
          sed -i 's/^          //' __migrate_once.php

          echo "Uploading one-shot via FTP..."
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 60;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR}/public;
            put __migrate_once.php;
            bye
          "

          echo "Running migrate over HTTPS..."
          set +e
          RESP=$(curl -fsS -L --max-time 120 \
            "https://aura.vonluqi.com/__migrate_once.php?token=${TOKEN}" 2>&1)
          RC=$?
          set -e
          echo "$RESP"

          echo "Deleting one-shot (best effort)..."
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            cd ${DIR}/public;
            rm -f __migrate_once.php;
            bye
          " || true
          rm -f __migrate_once.php

          if [ "$RC" -ne 0 ]; then
            echo "FATAL: curl failed (exit $RC)"
            exit 1
          fi
          echo "$RESP" | grep -q MIGRATE_OK
          echo "Migrate HostGator OK (no SSH shell required)"
